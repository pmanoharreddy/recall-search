<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>recall</title>
<style>
  :root {
    --paper: #f4f6f8;
    --surface: #ffffff;
    --ink: #101828;
    --slate: #4b5668;
    --rule: #d6dce4;
    --mark: #ffd84d;
    --mark-ink: #101828;
    --danger: #b42318;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0e1116;
      --surface: #151a22;
      --ink: #e8ecf2;
      --slate: #9aa6b8;
      --rule: #2a313c;
      --danger: #ff8a80;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.5 var(--sans);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 56px 20px 96px; }

  header h1 {
    font: 600 clamp(2rem, 5.2vw, 3.1rem)/1.1 var(--serif);
    letter-spacing: -0.01em;
    margin: 0 0 12px;
    text-wrap: balance;
  }
  header p { margin: 0; color: var(--slate); max-width: 56ch; }

  form { margin-top: 32px; }
  .field { display: flex; gap: 8px; }
  .field input[type="search"] {
    flex: 1; min-width: 0;
    font: 400 1.2rem/1.3 var(--serif);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-bottom: 2px solid var(--ink);
    border-radius: 4px 4px 0 0;
    padding: 14px 16px;
  }
  .field input::placeholder { color: var(--slate); opacity: .75; }
  button, .btn {
    font: 600 .95rem/1 var(--sans);
    border-radius: 4px;
    border: 1px solid var(--ink);
    padding: 12px 18px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink);
    background: transparent;
  }
  button.primary, .btn.primary { background: var(--ink); color: var(--paper); }
  button:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; box-shadow: 0 0 0 5px var(--ink); }

  fieldset { border: 0; padding: 0; margin: 18px 0 0; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
  legend { float: left; padding: 0; margin-right: 6px; color: var(--slate); font-size: .9rem; }
  fieldset label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: .95rem; }
  fieldset label.off { opacity: .5; cursor: not-allowed; }
  input[type="radio"] { accent-color: var(--ink); width: 16px; height: 16px; margin: 0; }

  #status { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--rule); color: var(--slate); font-size: .9rem; min-height: 1.5em; }
  #status code, .note code { font-family: var(--mono); font-size: .88em; }
  .note { color: var(--slate); margin: 10px 0 0; font-size: .92rem; }
  .error { color: var(--danger); }

  ul.results { list-style: none; margin: 0; padding: 0; }
  .hit { padding: 24px 0; border-bottom: 1px solid var(--rule); }
  .hit:first-child { padding-top: 12px; }
  .hit-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .hit-name { font-weight: 650; font-size: 1.05rem; overflow-wrap: anywhere; }
  .hit-page { color: var(--slate); font-size: .9rem; white-space: nowrap; }
  .hit-folder { color: var(--slate); font-size: .82rem; margin-top: 2px; overflow-wrap: anywhere; }
  .hit-text { font: 400 1.08rem/1.6 var(--serif); margin: 12px 0 0; max-width: 66ch; }
  mark { background: var(--mark); color: var(--mark-ink); padding: 0 .12em; border-radius: 2px; }
  .hit-why { color: var(--slate); font-size: .85rem; margin-top: 10px; }
  .hit-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .hit-actions .btn, .hit-actions button { padding: 9px 14px; font-size: .9rem; }
  .missing { color: var(--danger); font-size: .88rem; margin-top: 10px; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 520px) {
    .wrap { padding-top: 36px; }
    .field { flex-direction: column; }
    .field button { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>I remember the information, not the file.</h1>
    <p>Describe what you remember, or enter a filename. Recall finds the PDF, page and passage on your computer.</p>
  </header>

  <form id="form" role="search" autocomplete="off">
    <label class="sr-only" for="q">What do you remember?</label>
    <div class="field">
      <input id="q" name="q" type="search" placeholder="the pdf that explains the lost update problem with an example" autofocus>
      <button class="primary" type="submit" id="go">Search</button>
    </div>
    <fieldset>
      <legend>Match by</legend>
      <label title="Finds passages that mean the same thing, even with different words"><input type="radio" name="mode" value="semantic"> Meaning</label>
      <label title="Finds passages containing your words"><input type="radio" name="mode" value="keyword"> Exact words</label>
      <label title="Combines both rankings"><input type="radio" name="mode" value="hybrid" checked> Both</label>
    </fieldset>
  </form>

  <div id="status" role="status" aria-live="polite"></div>
  <ul class="results" id="results"></ul>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const form = $("form"), input = $("q"), statusEl = $("status"), list = $("results"), go = $("go");
  const FILLER = new Set("the and for with that this from what which about into have has pdf file document explains explain find show example where when how why was were are".split(" "));
  let index = null;   // /api/status payload
  let seq = 0;        // guards against out-of-order responses

  const modeValue = () => form.elements.mode.value;
  const setMode = (mode) => {
    const radios = Array.from(form.elements.mode);
    const choice = radios.find((r) => r.value === mode && !r.disabled)
      || radios.find((r) => r.value === "hybrid" && !r.disabled)
      || radios.find((r) => r.value === "keyword");
    choice.checked = true;
  };

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function el(tag, props = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else n.setAttribute(k, v);
    }
    for (const k of kids) if (k != null) n.append(k);
    return n;
  }
  function say(text, cls) { clear(statusEl); statusEl.append(el("span", { class: cls || "", text })); }

  // Wrap the words you typed in <mark>, built with DOM nodes (never innerHTML) so passage text can't inject markup.
  function highlight(text, query) {
    const terms = (query.toLowerCase().match(/[\p{L}\p{N}]+/gu) || [])
      .filter((t) => t.length >= 3 && !FILLER.has(t))
      .map((t) => (t.length >= 6 ? t.slice(0, -2) : t.length >= 5 ? t.slice(0, -1) : t))
      .map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
    if (!terms.length) return document.createTextNode(text);
    const re = new RegExp("(" + terms.map((t) => t + "\\p{L}*").join("|") + ")", "giu");
    const frag = document.createDocumentFragment();
    text.split(re).forEach((part, i) => {
      if (!part) return;
      frag.append(i % 2 ? el("mark", { text: part }) : document.createTextNode(part));
    });
    return frag;
  }

  const WHY = { "filename match": "Matched the filename", "keyword match": "Matched your words", "semantic match": "Matched the meaning",
                "keyword phrase match": "Matched your phrase",
                "keyword phrase match + semantic match": "Matched your phrase and the meaning",
                "keyword match + semantic match": "Matched your words and the meaning" };

  function renderHit(r, query) {
    const li = el("li", { class: "hit" });
    li.append(
      el("div", { class: "hit-head" },
        el("div", { class: "hit-name", text: r.name }),
        el("div", { class: "hit-page", text: "page " + r.page })),
      el("div", { class: "hit-folder", text: r.folder }),
      el("p", { class: "hit-text" }, highlight(r.snippet, query)),
      el("div", { class: "hit-why", text: WHY[r.why] || r.why })
    );
    const actions = el("div", { class: "hit-actions" });
    if (r.exists) {
      actions.append(
        el("a", { class: "btn primary", href: `${r.url}#page=${r.page}`, target: "_blank", rel: "noopener", text: `Open page ${r.page}` }),
        el("a", { class: "btn", href: r.download_url, text: "Download" })
      );
    } else {
      li.append(el("div", { class: "missing", text: "This file is no longer at its saved location. Run the index command again to refresh." }));
    }
    const copy = el("button", { type: "button", text: "Copy path" });
    copy.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(r.path); copy.textContent = "Copied"; }
      catch { copy.textContent = "Copy failed"; }
      setTimeout(() => (copy.textContent = "Copy path"), 1600);
    });
    actions.append(copy);
    li.append(actions);
    if (r.copies && r.copies.length) {
      const locations = el("ul");
      for (const other of r.copies) {
        const item = other.exists
          ? el("a", { href: `${other.url}#page=${r.page}`, target: "_blank", rel: "noopener", text: other.path })
          : el("span", { text: `${other.path} (missing)` });
        locations.append(el("li", {}, item));
      }
      li.append(el("details", { class: "hit-folder" },
        el("summary", { text: `Other locations (${r.copies.length})` }), locations));
    }
    return li;
  }

  function renderEmptyIndex() {
    clear(statusEl);
    statusEl.append(
      el("span", { text: "Nothing is indexed yet. In your terminal run " }),
      el("code", { text: "python -m recall.cli index <your folder>" }),
      el("span", { text: ", then reload this page." })
    );
  }

  function showIndexStatus() {
    if (!index) return;
    if (!index.files) { renderEmptyIndex(); return; }
    const parts = [`${index.files} PDF${index.files === 1 ? "" : "s"} indexed`];
    if (!index.chunks) parts.push("Search by filename. These PDFs contain no searchable text");
    else if (index.pending_embeddings === index.chunks) parts.push("Run the embed command to enable search by meaning");
    else if (index.pending_embeddings) parts.push(`${index.pending_embeddings} passages still need embeddings, so meaning search is partial`);
    if (index.failed_files) parts.push(`${index.failed_files} file${index.failed_files === 1 ? "" : "s"} failed to index`);
    say(parts.join(". ") + ".");
  }

  function showServerHelp() {
    say("Open Recall from its local server. ", "error");
    statusEl.append(
      el("a", { href: "http://127.0.0.1:8000/", text: "Open Recall" }),
      el("span", { text: ". To start the server from the project folder, run " }),
      el("code", { text: "python -m recall.cli serve" }),
      el("span", { text: " and open the address it prints." })
    );
  }

  async function loadStatus() {
    if (location.protocol === "file:") {
      go.disabled = true;
      showServerHelp();
      return;
    }
    try {
      const response = await fetch("/api/status");
      if (response.status === 404 || (response.ok && !response.headers.get("content-type")?.includes("application/json"))) {
        go.disabled = true;
        showServerHelp();
        return;
      }
      if (!response.ok) {
        say(`Could not read the index status (HTTP ${response.status}). Check the server output and reload.`, "error");
        return;
      }
      index = await response.json();
    } catch { showServerHelp(); return; }
    if (!index.semantic_available || index.chunks === index.pending_embeddings) {
      for (const radio of form.elements.mode) {
        if (radio.value === "keyword") continue;
        radio.disabled = true;
        radio.parentElement.classList.add("off");
        radio.parentElement.title = index.semantic_available
          ? "Index passages with embeddings to search by meaning"
          : "Install sentence-transformers to search by meaning";
      }
      setMode("keyword");
    }
    go.disabled = !index.files;
    fromUrl(false);
  }

  async function run(query, mode, push) {
    query = query.trim();
    const mine = ++seq;
    if (push) history.pushState(null, "", query ? `?q=${encodeURIComponent(query)}&mode=${mode}` : location.pathname);
    if (!query || go.disabled) { clear(list); showIndexStatus(); return; }
    say(mode === "keyword" ? "Searching…" : "Searching… the first search by meaning loads the language model and can take a minute.");
    clear(list);
    let data;
    try {
      const res = await fetch(`/api/search?q=${encodeURIComponent(query)}&mode=${mode}`);
      data = await res.json();
      if (mine !== seq) return;
      if (!res.ok) { say(data.error || "Search failed.", "error"); return; }
    } catch { if (mine === seq) showServerHelp(); return; }

    if (!data.results.length) {
      const meaningEnabled = !form.querySelector('input[value="semantic"]').disabled;
      say(`No passages matched “${query}”. Try other words${mode === "keyword" && meaningEnabled ? ", or switch to Meaning" : ""}.`);
      return;
    }
    say(`${data.results.length} file${data.results.length === 1 ? "" : "s"} found in ${data.took_ms} ms.`);
    data.results.forEach((r) => list.append(renderHit(r, query)));
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); run(input.value, modeValue(), true); });
  form.querySelectorAll('input[name="mode"]').forEach((r) =>
    r.addEventListener("change", () => { if (input.value.trim()) run(input.value, modeValue(), true); }));
  window.addEventListener("popstate", () => fromUrl(false));
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== input) { e.preventDefault(); input.focus(); input.select(); }
  });

  function fromUrl(push) {
    const p = new URLSearchParams(location.search);
    input.value = p.get("q") || "";
    setMode(p.get("mode"));
    run(input.value, modeValue(), push);
  }

  loadStatus();
})();
</script>
</body>
</html>
